[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find3r"
version = "0.2.0"
description = "Find3r — Open-source OSINT & security posture intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Find3r Contributors" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "certifi>=2024.2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]



[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Postgres is the deployment target; kept as an extra so the test suite and
# local development run on SQLite without needing a driver build.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
find3r = "neesha.cli.main:app"
neesha = "neesha.cli.main:app"

[tool.setuptools.packages.find]
include = ["neesha*", "find3r*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"neesha.console" = ["static/*.html", "static/*.css", "static/*.js"]
