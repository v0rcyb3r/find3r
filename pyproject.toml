[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neesha"
version = "0.1.0"
description = "Open-source OSINT targeting for the cybersecurity sales cycle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neesha Contributors" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
neesha = "neesha.cli.main:app"

[tool.setuptools.packages.find]
include = ["neesha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
