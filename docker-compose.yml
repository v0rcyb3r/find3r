# Neesha dev stack. Local mode binds nothing but 127.0.0.1.
#
#   docker compose build
#   docker compose run --rm neesha --help
#
# Team/cloud mode (Postgres) is opt-in via the "team" profile:
#   docker compose --profile team up
services:
  neesha:
    build: .
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./reports:/app/reports
    environment:
      NEESHA_STORE_KEY: ${NEESHA_STORE_KEY:-}
      NEESHA_PREFLIGHT_KEY: ${NEESHA_PREFLIGHT_KEY:-}
    entrypoint: ["neesha"]

  postgres:
    image: postgres:16-alpine
    profiles: ["team"]
    environment:
      POSTGRES_DB: neesha
      POSTGRES_USER: neesha
      POSTGRES_PASSWORD: ${NEESHA_PG_PASSWORD:-neesha}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
